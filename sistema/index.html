<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Gestão • Spartans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/sistema/styles.css" />
  <script src="/sistema/store-tools.js" defer></script>
<script src="/sistema/professional-tools.js" defer></script>
  <script src="/sistema/member-tools.js" defer></script>
  <script src="/demo/store-api.js" defer></script>
<script src="/demo/professor-api.js" defer></script>
<script src="/demo/member-api.js" defer></script>
<script src="/demo/api.js" defer></script>
<script src="/sistema/calendar.js" defer></script>
  <script src="/sistema/app.js" defer></script>
</head>
<body>
  <div id="boot" class="boot"><span class="loader" aria-hidden="true"></span><p>Preparando sua gestão…</p></div>
  <section id="auth" class="auth" hidden aria-labelledby="auth-title">
    <div class="auth-brand">
      <a href="/" aria-label="Voltar ao site da Spartans"><img src="/assets/spartans-wordmark-v4.png" width="400" height="400" alt="Academia Spartans" /></a>
      <div><p class="eyebrow">SPARTANS / CENTRAL DE GESTÃO</p><h1>SEU CONTROLE.<br /><span>SEU RITMO.</span></h1><p>Da primeira matrícula ao próximo vencimento.<br />Tudo o que movimenta a sua academia, em um só lugar.</p></div>
      <span class="auth-bottom">TATUQUARA · CURITIBA, PR <span aria-hidden="true">↗</span></span>
    </div>
    <div class="auth-panel"><div id="auth-content"></div></div>
  </section>
  <div id="shell" class="shell" hidden>
    <div id="nav-overlay" class="nav-overlay" hidden></div>
    <aside id="sidebar" class="sidebar" aria-label="Menu de gestão">
      <a class="sidebar-brand" href="#visao-geral" aria-label="Spartans — visão geral"><img src="/assets/spartans-wordmark-v4.png" alt="Spartans" width="400" height="400" /></a>
      <p class="nav-caption">SUA OPERAÇÃO</p>
      <nav id="navigation" aria-label="Navegação do sistema"></nav>
      <div class="sidebar-bottom"><button id="logout" type="button"><svg class="icon" aria-hidden="true"><use href="/assets/management-icons.svg#box-arrow-right"/></svg>Sair da conta</button></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="/assets/management-icons.svg#list"/></svg></button>
        <div class="breadcrumb">CENTRAL DE GESTÃO <span>/</span> <strong id="breadcrumb">Visão geral</strong></div>
        <label class="global-search"><svg class="icon" aria-hidden="true"><use href="/assets/management-icons.svg#search"/></svg><input id="search" type="search" placeholder="Buscar mensalista…" aria-label="Buscar no painel" autocomplete="off" /><kbd>/</kbd></label>
        <button id="refresh" type="button" class="icon-button" aria-label="Atualizar dados" title="Atualizar dados"><svg class="icon" aria-hidden="true"><use href="/assets/management-icons.svg#arrow-repeat"/></svg></button>
        <button id="my-account" type="button" class="user-badge" aria-label="Minha conta" title="Minha conta"><span id="user-initials" class="avatar"></span><span class="user-summary"><strong id="user-name"></strong><span id="user-role"></span></span></button>
      </header>
      <main id="view" tabindex="-1"></main>
      <footer class="app-footer"><span>SPARTANS <b>GESTÃO</b></span><span id="last-updated"></span></footer>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><div><p id="modal-eyebrow" class="eyebrow">SPARTANS / GESTÃO</p><h2 id="modal-title"></h2></div><button id="modal-close" class="icon-button" type="button" aria-label="Fechar janela"><svg class="icon" aria-hidden="true"><use href="/assets/management-icons.svg#x-lg"/></svg></button></div><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
